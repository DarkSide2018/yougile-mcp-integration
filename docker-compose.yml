version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: alertbot
      POSTGRES_USER: alertbot
      POSTGRES_PASSWORD: alertbot_pass
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alertbot -d alertbot"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      YOUGILE_API_KEY: ${YOUGILE_API_KEY}
      YOUGILE_API_BASE_URL: ${YOUGILE_API_BASE_URL}
    depends_on:
      - postgres

  alert-bot-app:
    build:
      context: .
      dockerfile: alert-bot-app/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      YOUGILE_API_KEY: ${YOUGILE_API_KEY}
      YOUGILE_API_BASE_URL: ${YOUGILE_API_BASE_URL}
      YOUGILE_DEFAULT_COLUMN_ID: ${YOUGILE_DEFAULT_COLUMN_ID}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL}
      OPENCODE_MODEL: ${OPENCODE_MODEL}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/alertbot
      SPRING_DATASOURCE_USERNAME: alertbot
      SPRING_DATASOURCE_PASSWORD: alertbot_pass
      MCP_SERVER_URL: http://mcp-server:8081
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_started

volumes:
  pgvector-data:
