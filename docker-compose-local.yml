version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: alertbot
      POSTGRES_USER: alertbot
      POSTGRES_PASSWORD: alertbot_pass
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U alertbot -d alertbot" ]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgvector-data:
