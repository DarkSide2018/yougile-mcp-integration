server:
  port: ${SERVER_PORT:8080}

spring:
  ai:
    mcp:
      client:
        enabled: true
        name: yougile-alert-client
        version: 1.0.0
        type: SYNC
        streamable-http:
          connections:
            yougile-mcp:
              url: ${MCP_SERVER_URL:http://localhost:8081}
    openai:
      api-key: ${OPENCODE_API_KEY}
      base-url: ${OPENCODE_BASE_URL:https://zen.opencode.ai/v1}
      chat:
        options:
          model: ${OPENCODE_MODEL:opencode-zen-1}
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alertbot}
    username: ${SPRING_DATASOURCE_USERNAME:alertbot}
    password: ${SPRING_DATASOURCE_PASSWORD:alertbot_pass}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}

yougile:
  api:
    key: ${YOUGILE_API_KEY}
    base-url: ${YOUGILE_API_BASE_URL:https://yougile.com/api-v2}
  default:
    column-id: ${YOUGILE_DEFAULT_COLUMN_ID}
